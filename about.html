<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        h1 {
            margin-bottom: 20px;
            text-align: center;
        }

        .about-container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .about-container h2 {
            margin-bottom: 10px;
        }

        .about-container p {
            line-height: 1.6;
        }

        .logo-banner {
            display: block;
            max-width: 400px;
            width: 100%;
            margin: 0 auto 20px auto;
}
    </style>
</head>
<body>
    <img src="https://logos-world.net/wp-content/uploads/2022/01/X-Men-Logo-1968.png" alt="X-Men Logo" class="logo-banner">
    <div class="about-container">
        <p>I chose to use X-Men as the theme for this application because I like the marvel univese and they are my favorite fictional superheroes. I chose this design to create a visually appealing and engaging experience for users to interact with and learn about these the characters.</p>
    </div>
</body>
</html>
